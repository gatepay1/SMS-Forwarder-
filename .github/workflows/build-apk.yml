name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Prepare project structure
        run: |
          # ১. ফাইলগুলো যদি gatepay-sms/ ফোল্ডারের ভেতর থাকে, তাহলে রুট ডিরেক্টরিতে নিয়ে আসবে
          if [ -d "gatepay-sms" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Moving files from gatepay-sms/ to root..."
            shopt -s dotglob
            mv gatepay-sms/* .
          fi

          # ২. ফাইলগুলো যদি কোনো কারণে রুটে ফ্ল্যাটভাবে পেস্ট করা থাকে, স্বয়ংক্রিয়ভাবে app মডিউলে সাজাবে
          if [ -f "MainActivity.kt" ] && [ ! -d "app/src/main/java/world/gatepay/sms" ]; then
            echo "Reorganizing flat files into standard Android structure..."
            mkdir -p app/src/main/java/world/gatepay/sms
            mkdir -p app/src/main/res/values
            mkdir -p app/src/main/res/drawable
            mv *.kt app/src/main/java/world/gatepay/sms/ 2>/dev/null || true
            [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
            [ -f "colors.xml" ] && mv colors.xml app/src/main/res/values/
            [ -f "ic_app.xml" ] && mv ic_app.xml app/src/main/res/drawable/
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GatePaySMS-v3-apk
          path: app/build/outputs/apk/debug/*.apk
          
